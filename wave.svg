<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="waving hand">
  <style>
    text { transform-box: fill-box; transform-origin: 70% 85%; animation: wave 2.6s ease-in-out infinite; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(16deg); }
      20% { transform: rotate(-8deg); }
      30% { transform: rotate(16deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }
    @media (prefers-reduced-motion: reduce) { text { animation: none; } }
  </style>
  <text x="32" y="50" font-size="46" text-anchor="middle">👋</text>
</svg>
